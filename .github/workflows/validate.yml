name: Validate legal center
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release.mjs
      - run: npx --yes --package mint@4.3.51 -- mint validate --format json
      - run: npx --yes --package mint@4.3.51 -- mint broken-links --check-anchors --check-redirects
